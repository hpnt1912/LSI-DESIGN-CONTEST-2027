<text x="825.0" y="241.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">data/cinic4_extra.npz</text>
<text x="825.0" y="258.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">84.000 ảnh (B3c, E, E2, E3d)</text>
