<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Pipeline toàn dự án: dữ liệu → huấn luyện → số nguyên → RTL</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="980" height="760" fill="#ffffff"/>
<text x="490.0" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#191919">Pipeline toàn dự án (mỗi hộp ghi file Python thực hiện)</text>
