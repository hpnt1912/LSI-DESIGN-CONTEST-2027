<path d="M760,456 L760,488 L490,488 L490,498" fill="none" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="500" width="250" height="56" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="155.0" y="524.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">export_&lt;run&gt;/qparams.npz/.json</text>
<text x="155.0" y="541.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">tham số số nguyên</text>
