<rect x="700" y="140" width="250" height="50" rx="6" fill="#cce3fd" stroke="#8c8c8c" stroke-width="1"/>
<text x="825.0" y="161.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">prepare_cinic4.py</text>
<text x="825.0" y="178.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">chỉ lấy ảnh ImageNet, bỏ ảnh CIFAR</text>
