<text x="490.0" y="441.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">forward → loss → backward → SGD/AdamW</text>
<line x1="490" y1="356" x2="490" y2="398" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="280" y1="428" x2="328" y2="428" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="700" y="400" width="250" height="56" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="825.0" y="424.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">checkpoints/&lt;run&gt;.pt</text>
<text x="825.0" y="441.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">trọng số float tốt nhất theo val</text>
