<text x="385.0" y="799" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">4 logit: [cat, dog, deer, horse]</text>
<text x="385.0" y="817" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">lớp dự đoán = argmax(logit)  (phần cứng chỉ cần so sánh 4 số)</text>
