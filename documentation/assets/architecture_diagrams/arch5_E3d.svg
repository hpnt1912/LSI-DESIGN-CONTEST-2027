<text x="385.0" y="729" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">logit = W·x + b  (không có ReLU, không softmax khi suy luận)</text>
<text x="136" y="720.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">fc</text>
<text x="644" y="713" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">tham số 7.172 = 1.792×4 + 4</text>
<text x="644" y="730" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">MAC 7.168</text>
