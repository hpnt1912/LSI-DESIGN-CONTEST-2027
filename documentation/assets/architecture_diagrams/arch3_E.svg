<text x="385.0" y="623" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">Linear (Fully Connected): 2.048 → 4</text>
<text x="385.0" y="641" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">logit = W·x + b  (không có ReLU, không softmax khi suy luận)</text>
<text x="136" y="632.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">fc</text>
<text x="644" y="625" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">tham số 8.196 = 2.048×4 + 4</text>
<text x="644" y="642" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">MAC 8.192</text>
<line x1="385.0" y1="654" x2="385.0" y2="686" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="688" width="470" height="54" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="385.0" y="711" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">4 logit: [cat, dog, deer, horse]</text>
<text x="385.0" y="729" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">lớp dự đoán = argmax(logit)  (phần cứng chỉ cần so sánh 4 số)</text>
<text x="136" y="720.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">Output</text>
<text x="450.0" y="786" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">Tổng: 138.372 tham số (sau gộp BN) · 19.767.296 MAC/ảnh · 4 tầng conv + 1 Linear</text>
