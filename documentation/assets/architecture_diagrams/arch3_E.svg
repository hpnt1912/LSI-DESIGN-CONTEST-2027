<text x="385.0" y="535" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">Flatten: 128 × 4 × 4 → 2.048</text>
<text x="385.0" y="553" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">duỗi theo thứ tự (kênh, hàng, cột) – torch.flatten(x, 1)</text>
<text x="136" y="544.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">Flatten</text>
<text x="644" y="544" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">không có tham số</text>
<line x1="385.0" y1="566" x2="385.0" y2="598" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
