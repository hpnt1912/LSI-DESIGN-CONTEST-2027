<text x="432.35" y="183" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">ReLU</text>
<rect x="469.6" y="160" width="146.4" height="54" rx="6" fill="#fde3d3" stroke="#8c8c8c" stroke-width="1"/>
<text x="542.8000000000001" y="183" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">MaxPool 2×2</text>
<text x="542.8000000000001" y="201" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 2</text>
<text x="136" y="192.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">conv1</text>
<text x="644" y="178" font-size="13" text-anchor="start" font-weight="bold" fill="#191919">ra: 16 × 16 × 16</text>
<text x="644" y="195" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">tham số 448 (sau gộp BN) · MAC 442.368</text>
<text x="644" y="210" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">trọng số int8, shift 7</text>
<line x1="385.0" y1="214" x2="385.0" y2="246" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="248" width="184.0" height="54" rx="6" fill="#cce3fd" stroke="#8c8c8c" stroke-width="1"/>
