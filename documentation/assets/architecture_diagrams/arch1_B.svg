<text x="242.0" y="289" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 1, padding 1</text>
<rect x="338.0" y="248" width="57.1" height="54" rx="6" fill="#e6f0fb" stroke="#8c8c8c" stroke-width="1"/>
<text x="366.55" y="271" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">BN</text>
<rect x="399.1" y="248" width="66.5" height="54" rx="6" fill="#e6f0fb" stroke="#8c8c8c" stroke-width="1"/>
<text x="432.35" y="271" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">ReLU</text>
<rect x="469.6" y="248" width="146.4" height="54" rx="6" fill="#fde3d3" stroke="#8c8c8c" stroke-width="1"/>
<text x="542.8000000000001" y="271" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">MaxPool 2×2</text>
<text x="542.8000000000001" y="289" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 2</text>
<text x="136" y="280.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">conv2</text>
<text x="644" y="266" font-size="13" text-anchor="start" font-weight="bold" fill="#191919">ra: 32 × 8 × 8</text>
<text x="644" y="283" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">tham số 4.640 (sau gộp BN) · MAC 1.179.648</text>
<text x="644" y="298" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">trọng số int8, shift 8</text>
<line x1="385.0" y1="302" x2="385.0" y2="334" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="336" width="184.0" height="54" rx="6" fill="#cce3fd" stroke="#8c8c8c" stroke-width="1"/>
<text x="242.0" y="359" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">Conv 3×3  32→64</text>
<text x="242.0" y="377" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 1, padding 1</text>
<rect x="338.0" y="336" width="57.1" height="54" rx="6" fill="#e6f0fb" stroke="#8c8c8c" stroke-width="1"/>
<text x="366.55" y="359" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">BN</text>
<rect x="399.1" y="336" width="66.5" height="54" rx="6" fill="#e6f0fb" stroke="#8c8c8c" stroke-width="1"/>
<text x="432.35" y="359" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">ReLU</text>
<rect x="469.6" y="336" width="146.4" height="54" rx="6" fill="#fde3d3" stroke="#8c8c8c" stroke-width="1"/>
<text x="542.8000000000001" y="359" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">MaxPool 2×2</text>
<text x="542.8000000000001" y="377" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 2</text>
<text x="136" y="368.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">conv3</text>
<text x="644" y="354" font-size="13" text-anchor="start" font-weight="bold" fill="#191919">ra: 64 × 4 × 4</text>
<text x="644" y="371" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">tham số 18.496 (sau gộp BN) · MAC 1.179.648</text>
<text x="644" y="386" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">trọng số int8, shift 8</text>
<line x1="385.0" y1="390" x2="385.0" y2="422" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="424" width="470" height="54" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="385.0" y="447" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">Flatten: 64 × 4 × 4 → 1.024</text>
<text x="385.0" y="465" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">duỗi theo thứ tự (kênh, hàng, cột) – torch.flatten(x, 1)</text>
<text x="136" y="456.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">Flatten</text>
<text x="644" y="456" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">không có tham số</text>
<line x1="385.0" y1="478" x2="385.0" y2="510" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="512" width="470" height="54" rx="6" fill="#fde3d3" stroke="#8c8c8c" stroke-width="1"/>
<text x="385.0" y="535" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">Linear (Fully Connected): 1.024 → 4</text>
<text x="385.0" y="553" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">logit = W·x + b  (không có ReLU, không softmax khi suy luận)</text>
<text x="136" y="544.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">fc</text>
<text x="644" y="537" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">tham số 4.100 = 1.024×4 + 4</text>
<text x="644" y="554" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">MAC 4.096</text>
<line x1="385.0" y1="566" x2="385.0" y2="598" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="600" width="470" height="54" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="385.0" y="623" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">4 logit: [cat, dog, deer, horse]</text>
<text x="385.0" y="641" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">lớp dự đoán = argmax(logit)  (phần cứng chỉ cần so sánh 4 số)</text>
<text x="136" y="632.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">Output</text>
<text x="450.0" y="698" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">Tổng: 27.684 tham số (sau gộp BN) · 2.805.760 MAC/ảnh · 3 tầng conv + 1 Linear</text>
</svg>
