<svg xmlns="http://www.w3.org/2000/svg" width="900" height="714" viewBox="0 0 900 714" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Kiến trúc 1 – B (B_16_32_64)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="900" height="714" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#191919">Kiến trúc 1: B – Cơ bản (~80%)</text>
<text x="450.0" y="52" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">Lượt chạy: B_16_32_64   ·   nguồn: model/net.py + model/export_*/qparams.json</text>
<rect x="150" y="72" width="470" height="54" rx="6" fill="#efefef" stroke="#8c8c8c" stroke-width="1"/>
<text x="385.0" y="94" font-size="14" text-anchor="middle" font-weight="bold" fill="#191919">Ảnh vào: 3 × 32 × 32 (R, G, B)</text>
<text x="385.0" y="113" font-size="12" text-anchor="middle" font-weight="normal" fill="#666666">pixel uint8 0..255  →  x = pixel / 256  (data.to_tensor)</text>
<text x="136" y="104.0" font-size="13" text-anchor="end" font-weight="bold" fill="#191919">Input</text>
<text x="644" y="104" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">tensor (N, 3, 32, 32)</text>
<line x1="385.0" y1="126" x2="385.0" y2="158" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="150" y="160" width="184.0" height="54" rx="6" fill="#cce3fd" stroke="#8c8c8c" stroke-width="1"/>
<text x="242.0" y="183" font-size="13" text-anchor="middle" font-weight="bold" fill="#191919">Conv 3×3  3→16</text>
<text x="242.0" y="201" font-size="11" text-anchor="middle" font-weight="normal" fill="#666666">stride 1, padding 1</text>
<rect x="338.0" y="160" width="57.1" height="54" rx="6" fill="#e6f0fb" stroke="#8c8c8c" stroke-width="1"/>
<text x="366.55" y="183" font-size="13" text-anchor="middle" font-weight="normal" fill="#191919">BN</text>
